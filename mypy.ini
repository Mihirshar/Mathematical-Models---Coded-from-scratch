[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude =
    (
        ^/build/|
        ^/dist/|
        ^/.venv/|
        ^/venv/|
        ^/.git/|
        ^/.pytest_cache/|
        ^/.mypy_cache/|
        ^/tests/
    )

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True
